<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Browse every game in the catalogue and read reviews from players who share your taste." />
  <title>All games — Playstyle</title>
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="header">
    <div class="header__inner">
      <a class="logo" href="/" aria-label="Playstyle home">
        <span class="logo__mark"></span><span>Playstyle</span>
      </a>
      <div class="header__spacer"></div>
      <nav class="header__nav" id="site-nav"></nav>
    </div>
  </header>

  <main id="main" class="page">
    <div class="section-head section-head--page">
      <div>
        <h1 class="feed__title">All games</h1>
        <p id="games-sub">Pick any game to read reviews from players who share your taste.</p>
      </div>
    </div>

    <div class="quiz__bar">
      <div class="quiz__search">
        <label class="sr-only" for="games-search">Search games</label>
        <input class="input" id="games-search" type="search" placeholder="Search games…" autocomplete="off" />
      </div>
      <div>
        <label class="sr-only" for="games-sort">Sort by</label>
        <select class="input" id="games-sort">
          <option value="reviews">Most reviewed</option>
          <option value="popular">Most popular</option>
          <option value="rating">Highest rated</option>
          <option value="newest">Newest</option>
          <option value="title">A–Z</option>
        </select>
      </div>
      <div class="quiz__filters" id="games-genres" role="group" aria-label="Filter by genre"></div>
    </div>

    <div class="gamegrid" id="games-grid" aria-live="polite"></div>
    <p class="empty__body" id="games-none" hidden>Nothing matches that search.</p>
    <div class="loadmore">
      <button class="btn" type="button" id="games-more" hidden>Show more games</button>
    </div>
  </main>

  <script type="module" src="/js/games.js"></script>
</body>
</html>
